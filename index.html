<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Web Drum Machine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Web Drum Machine</h1>
      </div>

      <div class="transport">
        <button id="ss" class="primary-btn">Play</button>
        <button id="clearPattern">Clear</button>
        <button id="resetProject">Reset</button>
      </div>
    </header>

    <section class="panel controls">
      <label>
        BPM
        <input id="bpmSlider" type="range" min="50" max="180" value="100">
        <span id="bpmValue">100</span>
      </label>

      <label>
        Swing
        <input id="swingSlider" type="range" min="0" max="100" value="0">
        <span id="swingValue">0%</span>
      </label>

    </section>

    <section class="panel">
      <h2>Pattern Sequencer</h2>

      <div class="pattern-controls">
        <div class="pattern-buttons">
          <button class="pattern-btn active" data-pattern="A">Pattern A</button>
          <button class="pattern-btn" data-pattern="B">Pattern B</button>
          <button class="pattern-btn" data-pattern="C">Pattern C</button>
          <button class="pattern-btn" data-pattern="D">Pattern D</button>
        </div>

        <div class="right-controls">
          <button id="copyPattern">Copy</button>
          <button id="pastePattern">Paste</button>

          <label>
            Length
            <select id="patternLength">
              <option value="8">8 steps</option>
              <option value="16">16 steps</option>
            </select>
          </label>
        </div>
      </div>

      <div id="beatVisualiser" class="beat-visualiser"></div>
      <div id="sequencerGrid" class="sequencer-grid"></div>
    </section>

    <section class="panel">
      <h2>Spectrum Analyser</h2>

      <div class="spectrum">
        <div>
          <span>Kick</span>
          <div class="meter"><div id="meter-kick"></div></div>
        </div>

        <div>
          <span>Snare</span>
          <div class="meter"><div id="meter-snare"></div></div>
        </div>

        <div>
          <span>Hi-Hat</span>
          <div class="meter"><div id="meter-hihat"></div></div>
        </div>

        <div>
          <span>Tom</span>
          <div class="meter"><div id="meter-tom"></div></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Song Mode</h2>

      <div class="song-controls">
        <select id="songPatternSelect">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>

        <button id="addToSong">Add Pattern</button>
        <button id="playSong">Play Song</button>
        <button id="clearSong">Clear Song</button>
      </div>

      <div id="songOrder" class="song-order"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Save / Load Project</h2>
        <span id="autosaveStatus" class="autosave-status">Autosave ready</span>
      </div>
      
      <div class="project-controls">
        <button id="export-btn" class="export-btn">Export Project</button>
        
        <div class="drop-zone" id="importDropZone">
          <label>
            Drag & Drop here or click to import
            <input type="file" id="drop-file" accept=".zip,.json,application/json" style="display: none">
            <button id="import-btn" class="primary-btn">Import Project</button>
          </label>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Effects Rack</h2>

      <div class="effects-grid">
        <label>Delay <input id="delay" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label>Reverb <input id="reverb" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label>Distortion <input id="distortion" type="range" min="0" max="100" step="1" value="0"></label>
        <label>Compressor <input id="compressor" type="range" min="-60" max="0" step="1" value="-24"></label>
        <label>EQ Low <input id="eqLow" type="range" min="-20" max="20" step="1" value="0"></label>
        <label>EQ Mid <input id="eqMid" type="range" min="-20" max="20" step="1" value="0"></label>
        <label>EQ High <input id="eqHigh" type="range" min="-20" max="20" step="1" value="0"></label>
      </div>
    </section>

    <section class="panel">
      <h2>Custom Sample Loader</h2>

      <div class="drop-zone" id="dropZone">
        <div style="display: block;">
          Drag & Drop audio files here (WAV, MP3) or click to upload
          <input type="file" id="sampleUpload" multiple accept="audio/*" style="display: none">
        </div>
        <button id="upload-btn" class="primary-btn" style="margin-top: 10px;">Upload Samples</button>
      </div>
    </section>

    <section class="panel">
      <h2>Samples</h2>
      
      <div id="sampleList" class="sample-list"></div>
      
      <div id="sampleEditor" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #2e2e3a;">
        <h3>Sample Editor</h3>
        
        <select id="editSampleSelect">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hihat">Hi-Hat</option>
          <option value="tom">Tom</option>
        </select>

        <div class="sample-editor-controls">
          <label>
            Volume:
            <input type="range" id="sampleVolume" min="0" max="200" value="100" step="1">
            <span id="volumeValue">100</span>%
          </label>

          <label>
            Pitch:
            <input type="range" id="samplePitch" min="0.5" max="2" value="1" step="0.01">
            <span id="pitchValue">1.00</span>x
          </label>

          <label>
            Reverse:
            <input type="checkbox" id="sampleReverse">
          </label>

          <div class="editor-buttons">
            <button id="saveSampleSettings">Save Settings</button>
            <button id="resetSample">Reset to Default</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
