<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Web Drum Machine</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Web Drum Machine</h1>
      </div>

      <div class="transport">
        <button id="ss" class="primary-btn">Play</button>
        <button id="clearPattern">Clear</button>
        <button id="resetProject">Reset</button>
      </div>
    </header>

    <section class="panel controls">
      <label>
        BPM
        <input id="bpmSlider" type="range" min="50" max="180" value="100">
        <span id="bpmValue">100</span>
      </label>

      <label>
        Swing
        <input id="swingSlider" type="range" min="0" max="100" value="0">
        <span id="swingValue">0%</span>
      </label>

    </section>

    <section class="panel">
      <h2>Pattern Sequencer</h2>

      <div class="pattern-controls">
        <button class="pattern-btn active" data-pattern="A">Pattern A</button>
        <button class="pattern-btn" data-pattern="B">Pattern B</button>
        <button class="pattern-btn" data-pattern="C">Pattern C</button>
        <button class="pattern-btn" data-pattern="D">Pattern D</button>

        <button id="copyPattern">Copy</button>
        <button id="pastePattern">Paste</button>

        <label>
          Length
          <select id="patternLength">
            <option value="8">8 steps</option>
            <option value="16">16 steps</option>
          </select>
        </label>
      </div>

      <div id="beatVisualiser" class="beat-visualiser"></div>
      <div id="sequencerGrid" class="sequencer-grid"></div>
    </section>

    <section class="panel">
      <h2>Spectrum Analyser</h2>

      <div class="spectrum">
        <div>
          <span>Kick</span>
          <div class="meter"><div id="meter-kick"></div></div>
        </div>

        <div>
          <span>Snare</span>
          <div class="meter"><div id="meter-snare"></div></div>
        </div>

        <div>
          <span>Hi-Hat</span>
          <div class="meter"><div id="meter-hihat"></div></div>
        </div>

        <div>
          <span>Tom</span>
          <div class="meter"><div id="meter-tom"></div></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Song Mode</h2>

      <div class="song-controls">
        <select id="songPatternSelect">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>

        <button id="addToSong">Add Pattern</button>
        <button id="playSong">Play Song</button>
        <button id="clearSong">Clear Song</button>
      </div>

      <div id="songOrder" class="song-order"></div>
    </section>

    <section class="panel">
      <h2>Save / Load Project</h2>

      <div class="file-controls">
        <button id="exportProject">Export JSON</button>

        <label class="file-label">
          Import JSON
          <input id="importProject" type="file" accept=".json,application/json">
        </label>

        <span id="autosaveStatus">Autosave ready</span>
      </div>
    </section>

    <section class="panel">
      <h2>Effects Rack</h2>

      <div class="effects-grid">
        <label>Delay <input id="delay" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label>Compressor <input id="compressor" type="range" min="-60" max="0" step="1" value="-24"></label>
        <label>EQ Low <input id="eqLow" type="range" min="-20" max="20" step="1" value="0"></label>
        <label>EQ Mid <input id="eqMid" type="range" min="-20" max="20" step="1" value="0"></label>
        <label>EQ High <input id="eqHigh" type="range" min="-20" max="20" step="1" value="0"></label>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
